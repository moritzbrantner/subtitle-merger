name: Apply typed generation contract refactor

on:
  push:
    branches: [refactor/typed-generation-contract]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Apply coordinator refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old!r}")
              file.write_text(text.replace(old, new, count))

          generation = Path('backend/src/generation.rs')
          text = generation.read_text()
          text = text.replace(
              'use crate::{AppError, AppState};\n',
              'use crate::{AppError, AppState};\n\nmod contracts;\n\nuse contracts::{JobPhase, JobProgress, JobState, phase_for_event};\n',
              1,
          )
          text = text.replace('    state: String,\n    phase: String,', '    state: JobState,\n    phase: JobPhase,', 1)
          text = text.replace('        state: "queued".to_string(),\n        phase: "queued".to_string(),', '        state: JobState::Queued,\n        phase: JobPhase::Queued,', 1)
          text = text.replace(
              '    let _ = sender.send("{\\"state\\":\\"running\\",\\"phase\\":\\"transcribing\\"}".to_string());',
              '    send_progress(&sender, JobPhase::Transcribing);',
              1,
          )
          text = text.replace('                job.state = "completed".to_string();\n                job.phase = "completed".to_string();', '                job.state = JobState::Completed;\n                job.phase = JobPhase::Completed;', 1)
          text = text.replace('                job.state = "cancelled".to_string();\n                job.phase = "cancelled".to_string();', '                job.state = JobState::Cancelled;\n                job.phase = JobPhase::Cancelled;', 1)
          text = text.replace('                job.state = "failed".to_string();\n                job.phase = "failed".to_string();', '                job.state = JobState::Failed;\n                job.phase = JobPhase::Failed;', 1)
          text = text.replace(
              '        let payload = serde_json::to_string(&*job)\n            .unwrap_or_else(|_| "{\\"state\\":\\"failed\\"}".to_string());\n        inner.active_job = None;\n        let _ = sender.send(payload);',
              '        inner.active_job = None;\n        if let Ok(payload) = serde_json::to_string(&*job) {\n            let _ = sender.send(payload);\n        }',
              1,
          )
          text = text.replace(
              'struct SseObserver {\n    sender: broadcast::Sender<String>,\n}\n\nimpl TranscriptionProgressObserver for SseObserver {\n    fn observe(&mut self, event: TranscriptionProgressEvent) {\n        let _ = self.sender.send(\n            serde_json::json!({ "state": "running", "phase": format!("{event:?}") }).to_string(),\n        );\n    }\n}',
              '''fn send_progress(sender: &broadcast::Sender<String>, phase: JobPhase) {\n    if let Ok(payload) = serde_json::to_string(&JobProgress::running(phase)) {\n        let _ = sender.send(payload);\n    }\n}\n\nstruct SseObserver {\n    sender: broadcast::Sender<String>,\n}\n\nimpl TranscriptionProgressObserver for SseObserver {\n    fn observe(&mut self, event: TranscriptionProgressEvent) {\n        if let Some(phase) = phase_for_event(&event) {\n            send_progress(&self.sender, phase);\n        }\n    }\n}''',
              1,
          )
          generation.write_text(text)

          app = Path('frontend/src/App.tsx')
          text = app.read_text()
          text = text.replace(
              "import { SubtitleExportDialog } from './SubtitleExportDialog'\n",
              "import { SubtitleExportDialog } from './SubtitleExportDialog'\nimport {\n  startSubtitleGeneration,\n  subscribeSubtitleJob,\n  type SubtitleJobSubscription,\n} from './generation/client'\nimport {\n  formatSubtitleJobPhase,\n  type GeneratedTrack,\n  type SubtitleJob,\n  type SubtitleJobUpdate,\n} from './generation/types'\n",
              1,
          )
          text = text.replace('  readApiError,\n', '', 1)
          old_types = '''type GeneratedCue = { startMs: number; endMs: number; text: string; actor?: string }\ntype GeneratedTrack = { language: string; pivoted: boolean; cues: GeneratedCue[] }\ntype SubtitleJob = {\n  jobId: string\n  state: string\n  phase: string\n  progress: number\n  message: string\n  sourceTrack?: GeneratedTrack\n  translationTrack?: GeneratedTrack\n}\n\n'''
          text = text.replace(old_types, '', 1)
          text = text.replace(
              '  const jobEventsRef = useRef<EventSource | null>(null)',
              '  const jobEventsRef = useRef<SubtitleJobSubscription | null>(null)',
              1,
          )
          start = text.index('  async function generateSubtitles() {')
          end = text.index('  function applySubtitleJob(job: SubtitleJob) {', start)
          replacement = '''  async function generateSubtitles() {\n    if (!selectedVideo) {\n      return\n    }\n\n    setIsGenerating(true)\n    setGenerationMessage('Preparing subtitle generation…')\n\n    try {\n      const job = await startSubtitleGeneration({\n        video: selectedVideo,\n        targetLanguage: targetLanguage || undefined,\n        diarize,\n      })\n\n      setGenerationMessage(job.message)\n      jobEventsRef.current?.close()\n      jobEventsRef.current = subscribeSubtitleJob(job.jobId, applySubtitleJobUpdate, {\n        onProtocolError: () => setGenerationMessage('Subtitle generation is running…'),\n      })\n    } catch (error) {\n      setGenerationMessage(\n        error instanceof Error ? error.message : 'Could not start subtitle generation.',\n      )\n    } finally {\n      setIsGenerating(false)\n    }\n  }\n\n  function applySubtitleJobUpdate(update: SubtitleJobUpdate) {\n    if (update.kind === 'progress') {\n      setGenerationMessage(`${formatSubtitleJobPhase(update.progress.phase)}…`)\n      return\n    }\n\n    applySubtitleJob(update.job)\n  }\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '''  function applySubtitleJob(job: SubtitleJob) {\n    setGenerationMessage(job.message || `${job.phase}…`)\n    if (job.state !== 'completed') return\n    jobEventsRef.current?.close()''',
              '''  function applySubtitleJob(job: SubtitleJob) {\n    setGenerationMessage(job.message || `${formatSubtitleJobPhase(job.phase)}…`)\n    if (job.state === 'completed' || job.state === 'cancelled' || job.state === 'failed') {\n      jobEventsRef.current?.close()\n    }\n    if (job.state !== 'completed') return''',
              1,
          )
          app.write_text(text)
          PY
      - name: Format Rust sources
        run: cargo fmt --manifest-path backend/Cargo.toml
      - name: Verify application
        run: bun run check
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src frontend/src
          git commit -m "Type subtitle generation lifecycle and protocol"
          git push origin HEAD:refactor/typed-generation-contract
