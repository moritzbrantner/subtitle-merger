name: Browser Acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODING_TOOLING_DIR: ${{ github.workspace }}/.source/coding-tooling
      EDITOR_CORE_SOURCE: ${{ github.workspace }}/.source/editor-core
      TIMELINE_EDITOR_SOURCE: ${{ github.workspace }}/.source/timeline-editor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check out coding-tooling source dependency runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: moritzbrantner/coding-tooling
          ref: c67d5b11de0576f96d484db5ac8060cc1655a007
          path: .source/coding-tooling
      - name: Check out editor-core source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: moritzbrantner/editor-core
          ref: 1a52e27ddacc5daa8b39713e9de8edd1c498c640
          path: .source/editor-core
      - name: Check out timeline-editor source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: moritzbrantner/timeline-editor
          ref: 716eb6b5c4a66a18c57e5d0507fdfdcd3a3a89f5
          path: .source/timeline-editor
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Verify exact editor-family source graph
        run: bun run source:verify-graph
      - name: Prepare editor-family source
        run: bun run source:prepare
      - name: Smoke-test editor-family source
        run: bun run source:smoke
      # Cached, time-boxed apt (skips image-provided packages) instead of a bare apt-get that
      # can stall on azure.archive.ubuntu.com.
      - name: Install FFmpeg and Chromium system dependencies
        uses: moritzbrantner/reusable-workflows/.github/actions/install-system-packages@ce950447a1e0cbed601dc6d7b3e42fa0e53ab3c6 # main
        with:
          packages: ffmpeg
          playwright_browsers: chromium
      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Install Pages dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Run deterministic browser acceptance
        env:
          CAPTURE_UI_SCREENSHOT: "1"
        run: bun run test:acceptance
      - name: Run focused video path browser tests
        run: bun run test:e2e:video-load
      - name: Build Pages Rust WebAssembly asset
        run: bun run build:web-wasm
      - name: Run Pages browser generation regression
        env:
          CAPTURE_UI_SCREENSHOT: "1"
        run: bunx playwright test e2e/pages-browser-generation.acceptance.spec.ts --config playwright.pages.config.ts --retries=0
      - name: Report active source revisions
        if: always()
        run: bun run source:status
      - name: Upload UI consumer screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-consumer-convergence
          path: |
            .artifacts/ui-consumer-convergence.png
            .artifacts/browser-generation-readability.png
            .artifacts/direct-subtitle-editor.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-acceptance-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
