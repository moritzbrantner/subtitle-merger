name: Browser Acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODING_TOOLING_DIR: ${{ github.workspace }}/.source/coding-tooling
      EDITOR_CORE_SOURCE: ${{ github.workspace }}/.source/editor-core
      TIMELINE_EDITOR_SOURCE: ${{ github.workspace }}/.source/timeline-editor
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Check out coding-tooling source dependency runtime
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: c67d5b11de0576f96d484db5ac8060cc1655a007
          path: .source/coding-tooling
      - name: Check out editor-core source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/editor-core
          ref: 1a52e27ddacc5daa8b39713e9de8edd1c498c640
          path: .source/editor-core
      - name: Check out timeline-editor source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/timeline-editor
          ref: 716eb6b5c4a66a18c57e5d0507fdfdcd3a3a89f5
          path: .source/timeline-editor
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify exact editor-family source graph
        run: bun run source:verify-graph
      - name: Prepare editor-family source
        run: bun run source:prepare
      - name: Smoke-test editor-family source
        run: bun run source:smoke
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run deterministic browser acceptance
        env:
          CAPTURE_UI_SCREENSHOT: "1"
        run: bun run test:acceptance
      - name: Run focused video path browser tests
        run: bun run test:e2e:video-load
      - name: Report active source revisions
        if: always()
        run: bun run source:status
      - name: Upload UI consumer screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a # v7
        with:
          name: ui-consumer-convergence
          path: .artifacts/ui-consumer-convergence.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-acceptance-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
