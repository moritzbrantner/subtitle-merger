name: Browser Acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check out editor-core source
        uses: actions/checkout@v6
        with:
          repository: moritzbrantner/editor-core
          ref: dc73292353ac3dda09084a70215068a5b89af866
          path: .acceptance-sources/editor-core
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run deterministic browser acceptance
        run: bun run test:acceptance
      - name: Run focused video path browser tests
        run: bun run test:e2e:video-load
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
