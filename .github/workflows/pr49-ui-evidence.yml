name: PR 49 UI Evidence

on:
  push:
    branches:
      - evidence/pr49-ui

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build acceptance frontend
        run: bunx tsc -b frontend && bunx vite build frontend --config frontend/vite.acceptance.config.ts
      - name: Start acceptance frontend
        run: |
          bun run --cwd frontend preview -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/subtitle-merger-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5174/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/subtitle-merger-preview.log
          exit 1
      - name: Capture rendered UI
        run: |
          cat > capture-ui.mjs <<'EOF'
          import { chromium } from '@playwright/test'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
          const pageErrors = []
          page.on('pageerror', (error) => pageErrors.push(error.stack ?? error.message))

          await page.goto('http://127.0.0.1:5174/', { waitUntil: 'networkidle' })
          await page.getByRole('button', { name: 'File', exact: true }).waitFor({ state: 'visible' })
          await page.waitForTimeout(500)

          if (pageErrors.length > 0) {
            throw new Error(`Browser errors:\n${pageErrors.join('\n')}`)
          }

          await page.screenshot({ path: 'subtitle-merger-pr49.png', fullPage: true })
          await browser.close()
          EOF
          bun capture-ui.mjs
      - name: Upload UI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: subtitle-merger-pr49-ui
          path: subtitle-merger-pr49.png
          retention-days: 7
