name: Apply app shell boundary refactor

on:
  push:
    branches: [refactor/app-shell-boundaries]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Shrink App into feature-owned components
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('frontend/src/App.tsx')
          text = app.read_text()

          text = text.replace("import { useEffect, useMemo, useRef, useState, type RefObject } from 'react'", "import { useEffect, useMemo, useRef, useState, type RefObject } from 'react'", 1)
          text = text.replace(
              "import { SubtitleExportDialog } from './SubtitleExportDialog'",
              "import { SubtitleExportDialog } from './SubtitleExportDialog'\nimport { AppHeader } from './app/AppHeader'\nimport { GenerationPanel } from './app/GenerationPanel'\nimport {\n  ReferenceVideoPreview,\n  probeReferenceVideoMetadata,\n  type ReferenceVideo,\n} from './app/ReferenceVideoPreview'\nimport { StatusMessages } from './app/StatusMessages'",
              1,
          )
          text = text.replace(
              "import {\n  loadSubtitleAssets,\n  requestVideoPick,\n  type LoadedVideo,\n  type LoadWarning,\n} from './video-load'",
              "import { loadSubtitleAssets, requestVideoPick, type LoadedVideo, type LoadWarning } from './video-load'",
              1,
          )
          text = text.replace(
              "import {\n  appearances,\n  applyAppearance,\n  getPreferredAppearance,\n  type Appearance,\n} from './appearance'",
              "import { applyAppearance, getPreferredAppearance, type Appearance } from './appearance'",
              1,
          )
          text = text.replace(
              "import {\n  formatLanguageName,\n  getMessages,\n  getPreferredLocale,\n  persistLocale,\n  supportedLocales,\n  type AppMessages,\n  type Locale,\n} from './localization'",
              "import { getMessages, getPreferredLocale, persistLocale, type Locale } from './localization'",
              1,
          )

          start = text.index('type ReferenceVideo = {')
          end = text.index('function useTimelineViewportWidth', start)
          text = text[:start] + text[end:]

          start = text.index('function ReferenceVideoPreview(')
          end = text.index('function App() {', start)
          text = text[:start] + text[end:]

          text = text.replace("  const [isFileMenuOpen, setIsFileMenuOpen] = useState(false)\n", '', 1)
          text = text.replace('const metadata = await probeVideoMetadata(result.load.video.mediaUrl, messages)', 'const metadata = await probeReferenceVideoMetadata(result.load.video.mediaUrl, messages)', 1)

          header_start = text.index('      <header className="editor-topbar">')
          header_end = text.index('      </header>', header_start) + len('      </header>')
          header = '''      <AppHeader\n        messages={messages}\n        locale={locale}\n        appearance={appearance}\n        isPickingVideo={isPickingVideo}\n        onOpenVideo={() => void openVideo()}\n        onOpenExport={() => setIsExportDialogOpen(true)}\n        onLocaleChange={setLocale}\n        onAppearanceChange={setAppearance}\n      />'''
          text = text[:header_start] + header + text[header_end:]

          status_start = text.index('        {loadError ?')
          generation_start = text.index('        {selectedVideo ? (', status_start)
          text = text[:status_start] + '''        <StatusMessages\n          error={loadError}\n          warnings={loadWarnings}\n          emptyState={emptyState}\n        />\n''' + text[generation_start:]

          generation_start = text.index('        {selectedVideo ? (')
          generation_end = text.index('\n\n        <ReferenceVideoPreview', generation_start)
          generation = '''        {selectedVideo ? (\n          <GenerationPanel\n            messages={messages}\n            locale={locale}\n            targetLanguage={targetLanguage}\n            diarize={diarize}\n            isGenerating={isGenerating}\n            generationMessage={generationMessage}\n            onTargetLanguageChange={setTargetLanguage}\n            onDiarizeChange={setDiarize}\n            onGenerate={() => void generateSubtitles()}\n          />\n        ) : null}'''
          text = text[:generation_start] + generation + text[generation_end:]

          app.write_text(text)
          PY
      - name: Verify refactored application
        run: bun run check
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src
          git commit -m "Extract application shell boundaries"
          git push origin HEAD:refactor/app-shell-boundaries
