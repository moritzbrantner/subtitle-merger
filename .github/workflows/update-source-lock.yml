name: Update source lock

on:
  push:
    branches: [deps/timeline-editor-source]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Generate Bun lockfile
        run: bun install --lockfile-only
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock
          git commit -m "Regenerate Bun source dependency lock"
          git push origin HEAD:deps/timeline-editor-source
