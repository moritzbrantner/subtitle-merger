name: Pages

on:
  pull_request:
    paths:
      - "site/**"
      - "web-wasm/**"
      - "scripts/build-web-wasm.mjs"
      - "scripts/check-pages.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web-wasm/**"
      - "scripts/build-web-wasm.mjs"
      - "scripts/check-pages.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/streaming-video-inspection
      - name: Apply narrow borrow fix and restore normal workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("web-wasm/src/range_inspection.rs")
          text = path.read_text()
          old_cluster = """                0xA3 => {\n                    self.request_matroska_block_prefix(header, *time, None)?;\n                }"""
          new_cluster = """                0xA3 => {\n                    let cluster_time = *time;\n                    self.request_matroska_block_prefix(header, cluster_time, None)?;\n                }"""
          old_group = """                0xA1 => {\n                    self.request_matroska_block_prefix(\n                        header,\n                        *cluster_time,"""
          new_group = """                0xA1 => {\n                    let block_cluster_time = *cluster_time;\n                    self.request_matroska_block_prefix(\n                        header,\n                        block_cluster_time,"""
          if old_cluster not in text or old_group not in text:
              raise SystemExit("expected borrow-conflict snippets were not found")
          path.write_text(text.replace(old_cluster, new_cluster).replace(old_group, new_group))
          PY
          rm -f .github/workflows/patch-streaming-borrow.yml
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/pages.yml > .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-wasm/src/range_inspection.rs .github/workflows/pages.yml .github/workflows/patch-streaming-borrow.yml
          git commit -m "Fix Matroska range inspection borrowing"
          git push origin HEAD:feat/streaming-video-inspection
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-wasm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Test Rust browser core
        run: cargo test --manifest-path web-wasm/Cargo.toml --locked
      - name: Build Rust WebAssembly asset
        run: bun run build:web-wasm
      - name: Install Pages dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Typecheck Pages site
        working-directory: site
        run: bun run typecheck
      - name: Build static GitHub Pages export
        working-directory: site
        run: bun run build
      - name: Verify static export
        run: node scripts/check-pages.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
