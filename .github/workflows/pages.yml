name: Pages

on:
  # Unfiltered: `build` is a required check on main (ruleset main-trusted-merge), so it must
  # report on every pull request.
  workflow_call:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web-wasm/**"
      - "scripts/build-web-wasm.mjs"
      - "scripts/prepare-browser-transcription.mjs"
      - "scripts/check-pages.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: web-wasm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Test Rust browser core
        run: cargo test --manifest-path web-wasm/Cargo.toml --locked
      - name: Build Rust WebAssembly asset
        run: bun run build:web-wasm
      - name: Prepare pinned browser transcription runtime
        run: bun run prepare:browser-transcription
      - name: Install Pages dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Test Pages state helpers
        working-directory: site
        run: bun run test
      - name: Typecheck Pages site
        working-directory: site
        run: bun run typecheck
      - name: Build static GitHub Pages export
        working-directory: site
        run: bun run build
      - name: Verify static export
        run: node scripts/check-pages.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
