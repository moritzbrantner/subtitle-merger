name: Pages

on:
  pull_request:
    paths:
      - "site/**"
      - "web-wasm/**"
      - "scripts/build-web-wasm.mjs"
      - "scripts/check-pages.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web-wasm/**"
      - "scripts/build-web-wasm.mjs"
      - "scripts/check-pages.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/streaming-video-inspection
      - name: Apply narrow borrow fix and restore normal workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("web-wasm/src/range_inspection.rs")
          text = path.read_text()
          start = text.index("    fn consume_matroska_header")
          end = text.index("    fn request_matroska_block_prefix", start)
          replacement = r'''    fn consume_matroska_header(&mut self, offset: u64, bytes: &[u8]) -> Result<(), String> {
              let (scope_depth, header, scope_kind, scope_time) = {
                  let InspectionState::Matroska(state) = &mut self.state else {
                      return Err("Matroska state was lost while scanning the file.".into());
                  };
                  let scope_depth = state
                      .scopes
                      .len()
                      .checked_sub(1)
                      .ok_or_else(|| "Matroska scope stack is empty.".to_string())?;
                  let scope_end = state.scopes[scope_depth].end;
                  let header = parse_ebml_header(bytes, offset, scope_end)?;
                  state.scopes[scope_depth].offset = header.end;
                  let (scope_kind, scope_time) = match &state.scopes[scope_depth].kind {
                      MatroskaScopeKind::Top => (0_u8, 0_i64),
                      MatroskaScopeKind::Segment => (1_u8, 0_i64),
                      MatroskaScopeKind::Cluster { time } => (2_u8, *time),
                      MatroskaScopeKind::BlockGroup { cluster_time, .. } => (3_u8, *cluster_time),
                  };
                  (scope_depth, header, scope_kind, scope_time)
              };

              match scope_kind {
                  0 => {
                      if header.id == 0x1853_8067 {
                          let InspectionState::Matroska(state) = &mut self.state else {
                              return Err("Matroska state was lost while entering Segment.".into());
                          };
                          state.segment_seen = true;
                          state.scopes.push(MatroskaScope {
                              offset: header.payload_offset,
                              end: header.end,
                              kind: MatroskaScopeKind::Segment,
                          });
                      }
                  }
                  1 => match header.id {
                      0x1549_A966 => {
                          ensure_metadata_size(header.payload_length, "Matroska Info")?;
                          self.pending = Some(ReadRequest {
                              offset: header.payload_offset,
                              length: checked_read_length(header.payload_length)?,
                              phase: "Reading Matroska metadata",
                              purpose: ReadPurpose::MatroskaInfo { scope_depth },
                          });
                      }
                      0x1654_AE6B => {
                          ensure_metadata_size(header.payload_length, "Matroska Tracks")?;
                          self.pending = Some(ReadRequest {
                              offset: header.payload_offset,
                              length: checked_read_length(header.payload_length)?,
                              phase: "Reading Matroska track metadata",
                              purpose: ReadPurpose::MatroskaTracks { scope_depth },
                          });
                      }
                      0x1F43_B675 => {
                          let InspectionState::Matroska(state) = &mut self.state else {
                              return Err("Matroska state was lost while entering Cluster.".into());
                          };
                          state.scopes.push(MatroskaScope {
                              offset: header.payload_offset,
                              end: header.end,
                              kind: MatroskaScopeKind::Cluster { time: 0 },
                          });
                      }
                      _ => {}
                  },
                  2 => match header.id {
                      0xE7 => {
                          self.pending = Some(ReadRequest {
                              offset: header.payload_offset,
                              length: checked_read_length(header.payload_length)?,
                              phase: "Reading Matroska cluster timing",
                              purpose: ReadPurpose::MatroskaClusterTime { scope_depth },
                          });
                      }
                      0xA3 => self.request_matroska_block_prefix(header, scope_time, None)?,
                      0xA0 => {
                          let InspectionState::Matroska(state) = &mut self.state else {
                              return Err("Matroska state was lost while entering BlockGroup.".into());
                          };
                          state.scopes.push(MatroskaScope {
                              offset: header.payload_offset,
                              end: header.end,
                              kind: MatroskaScopeKind::BlockGroup {
                                  cluster_time: scope_time,
                                  duration_ticks: None,
                                  pending: Vec::new(),
                              },
                          });
                      }
                      _ => {}
                  },
                  3 => match header.id {
                      0x9B => {
                          self.pending = Some(ReadRequest {
                              offset: header.payload_offset,
                              length: checked_read_length(header.payload_length)?,
                              phase: "Reading subtitle duration",
                              purpose: ReadPurpose::MatroskaBlockDuration { scope_depth },
                          });
                      }
                      0xA1 => self.request_matroska_block_prefix(
                          header,
                          scope_time,
                          Some(scope_depth),
                      )?,
                      _ => {}
                  },
                  _ => return Err("Unknown Matroska scope kind.".into()),
              }
              Ok(())
          }

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm -f .github/workflows/patch-streaming-borrow.yml
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/pages.yml > .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-wasm/src/range_inspection.rs .github/workflows/pages.yml .github/workflows/patch-streaming-borrow.yml
          git commit -m "Fix Matroska range inspection borrowing"
          git push origin HEAD:feat/streaming-video-inspection
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web-wasm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Test Rust browser core
        run: cargo test --manifest-path web-wasm/Cargo.toml --locked
      - name: Build Rust WebAssembly asset
        run: bun run build:web-wasm
      - name: Install Pages dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Typecheck Pages site
        working-directory: site
        run: bun run typecheck
      - name: Build static GitHub Pages export
        working-directory: site
        run: bun run build
      - name: Verify static export
        run: node scripts/check-pages.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
