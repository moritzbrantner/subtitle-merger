name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    outputs:
      validate-browser-acceptance: ${{ steps.scope.outputs.validate-browser-acceptance }}
      validate-native-first-run: ${{ steps.scope.outputs.validate-native-first-run }}
      validate-pages: ${{ steps.scope.outputs.validate-pages }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        run: |
          import fnmatch
          import json
          import os
          import subprocess
          scopes = {'validate-browser-acceptance': {'paths': [], 'branches': []}, 'validate-native-first-run': {'paths': ['.github/workflows/native-first-run.yml', 'e2e/native-first-run.mjs', 'e2e/dev-startup.mjs', '.github/workflows/check.yml'], 'branches': [], 'same_repository': True}, 'validate-pages': {'paths': [], 'branches': []}}
          selected = {job: False for job in scopes}
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              with open(os.environ["GITHUB_EVENT_PATH"]) as source:
                  pull_request = json.load(source)["pull_request"]
              revision = pull_request["base"]["sha"] + "..." + pull_request["head"]["sha"]
              paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", revision]).decode().split("\0")
              selected = {
                  job: (not rule["paths"] or any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in rule["paths"]))
                  and (not rule["branches"] or any(fnmatch.fnmatchcase(pull_request["base"]["ref"], branch) for branch in rule["branches"]))
                  and (not rule.get("same_repository") or pull_request["head"]["repo"]["full_name"] == os.environ["GITHUB_REPOSITORY"])
                  for job, rule in scopes.items()
              }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              print(f"allow-skipped={json.dumps([job for job, active in selected.items() if not active])}", file=output)

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Diagnose lockfile drift
        if: failure()
        run: |
          bun install
          git diff -- bun.lock
          echo "LOCKFILE_SNAPSHOT_BEGIN"
          cat bun.lock
          echo "LOCKFILE_SNAPSHOT_END"
      - name: Check application
        run: bun run check
      - name: Verify Cargo lockfile is current
        run: git diff --exit-code -- Cargo.lock

  validate-browser-acceptance:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-browser-acceptance == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/browser-acceptance.yml

  validate-native-first-run:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-native-first-run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/native-first-run.yml

  validate-pages:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-pages == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["check", "validate-browser-acceptance", "validate-native-first-run", "validate-pages", "validation-scope"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["check", "validate-browser-acceptance", "validate-native-first-run", "validate-pages", "validation-scope"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
