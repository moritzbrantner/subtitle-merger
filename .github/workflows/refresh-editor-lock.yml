name: Refresh editor fallback lockfile

on:
  push:
    branches:
      - fix/source-first-editor-family

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Refresh lockfile
        run: bun install
      - name: Persist lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "build: refresh editor-family fallback lockfile"
            git push
          fi
