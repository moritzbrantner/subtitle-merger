[package]
name = "subtitle-merger-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
async-stream = "0.3"
dirs = "6"
futures-util = "0.3"
native-whisperx = { version = "=0.1.13", default-features = false, features = ["native", "media-decode", "translation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5.2", features = ["util"] }
